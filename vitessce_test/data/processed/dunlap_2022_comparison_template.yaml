name: Dunlap 2022 scRNA dataset
description: Investigation of comparison plots at patient/sample metadata

custom:
  app:
    height: 1600

# Add all datasets to be used
datasets:
  dunlap_2022:
    dataset_path: dunlap_2022.zarr
    type: anndata_zarr
    data:
      obs_set_paths: [obs/pred_cell_type_filtered]
      obs_set_names: [Cell Type]
    sample_comparison:
      sample_id_col:
        sample
      sample_grouping_cols: [Disease, Medications Taken, Donor]


views:
  group_builder:
    datasets:
      - dunlap_2022
    grid_xywh:
      [0, 0, 4, 4]

  scatterplot:
    datasets:
      - dunlap_2022
    grid_xywh: [4, 0, 4, 4]

  obs_sets:
    datasets:
      - dunlap_2022
    grid_xywh: [8, 0, 4, 4]

  dotplot:
    datasets:
      - dunlap_2022
    grid_xywh: [0, 4, 8, 3]

  feature_list:
    datasets:
      - dunlap_2022
    grid_xywh: [8, 4, 4, 3]
    props:
      enableMultiSelect: true

  heatmap:
    datasets:
      - dunlap_2022
    grid_xywh: [6, 7, 6, 3]
    props:
      transpose: true

  violin:
    datasets:
      - dunlap_2022
    grid_xywh: [0, 7, 6, 3]

coordination:
  # Coordination spaces define shared elements (e.g. coloring) that should be coordinated
  # across multiple datasets and views
  gene_global:
    datasets:
      - dunlap_2022
    views:
      - scatterplot
      - violin
      - heatmap
      - obs_sets
      - dotplot
      - feature_list
      - group_builder
    values:
      obsType: cell
      featureType: gene
      featureValueType: expression
      featureSelection: []
      sampleType: sample
      sampleSetSelection: []
      sampleSetFilter: []
