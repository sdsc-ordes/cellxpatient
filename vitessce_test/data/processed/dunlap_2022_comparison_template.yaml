name: Dunlap 2022 scRNA dataset
description: Investigation of comparison plots at patient/sample metadata

custom:
  app:
    height: 1600

# Add all datasets to be used
datasets:
  dunlap_2022:
    dataset_path: dunlap_2022.zarr
    type: anndata_zarr
    data:
      obs_set_paths: [obs/pred_cell_type_filtered]
      obs_set_names: [Cell Type]
    sample_comparison:
      sample_id_col:
        sample
      sample_grouping_cols: [Disease]


views:
  sample_manager:
    datasets:
      - dunlap_2022
    grid_xywh:
      [0, 0, 12, 2]

  scatterplot:
    datasets:
      - dunlap_2022
    grid_xywh: [4, 2, 8, 4]

  obs_sets:
    datasets:
      - dunlap_2022
    grid_xywh: [0, 2, 4, 4]

  dotplot:
    datasets:
      - dunlap_2022
    grid_xywh: [4, 6, 8, 4]

  feature_list:
    datasets:
      - dunlap_2022
    grid_xywh: [0, 6, 4, 4]
    props:
      allowMultipleSelect: true

  heatmap:
    datasets:
      - dunlap_2022
    grid_xywh: [6, 10, 6, 4]
    props:
      transpose: true

  violin:
    datasets:
      - dunlap_2022
    grid_xywh: [0, 10, 6, 4]

coordination:
  # Coordination spaces define shared elements (e.g. coloring) that should be coordinated
  # across multiple datasets and views
  gene_global:
    datasets:
      - dunlap_2022
    views:
      - scatterplot
      - violin
      - heatmap
      - obs_sets
      - dotplot
      - feature_list
      - sample_manager
    values:
      obsType: cell
      featureType: gene
      featureValueType: expression
      featureSelection: []
      sampleType: sample
      sampleSetSelection: []
      sampleSetFilter: []
