name: Xenium 0OE1 Example - Spatial Data
description: Visualization of gene expression in spatial transcriptomics

# Add all datasets to be used
datasets:
  xenium_0OE1:
    dataset_path: 0OE1_xenium_example.zarr
    type: spatialdata_zarr
    is_preprocessed: false
    preprocessing_data:
      umap_path: analysis/umap/gene_expression_2_components/projection.csv
      clusters_path: analysis/clustering/gene_expression_graphclust/clusters.csv
    data:     # TODO: define clearer data structure per file type with common defaults
       obs_sets_paths: [tables/table/obs/clusters]
       obs_sets_names: [Clusters]
       obs_seg_paths: [shapes/nucleus_boundaries, shapes/cell_boundaries]


views:
  spatial:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh:
      [2, 0, 5, 6]
    props:
      description: Comparison of gene expression between Healthy and SLE scRNA-seq data

  layer_controller:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [0, 4, 2, 5]

  scatterplot:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [7, 0, 5, 6]

  obs_sets:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [0, 6, 2, 3]

  heatmap:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [2, 6, 5, 6]
    props:
      transpose: true

  feature_list:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [0, 8, 2, 3]

  violin:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [7, 6, 5, 6]

  description:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [0, 0, 2, 1]
    props:
      description: "Example view of spatial data (Xenium 0OE1)"

  status:
    datasets:
     xenium_0OE1:
       grid_offset_xy: [0, 0]
    grid_xywh: [0, 1, 2, 1]


coordination:

  # Observation coordination across all views.
  global:
    datasets:
      - xenium_0OE1
    views:
      - obs_sets
      - scatterplot
      - feature_list
      - heatmap
      - violin
    values:
      obsType: cell
      featureType: gene
      featureValueType: expression

      obsSetSelection: null
      featureSelection: null

      obsColorEncoding: geneSelection
      featureValueColormapRange: [0.0, 0.5]

    per_layer:
      segmentation_layer:
        views:
          - spatial
          - layer_controller
        cell_channel:
          values:
            from: global
            spatialSegmentationFilled: false
        nucleus_channel:
          values:
            obsType: nucleus
            obsColorEncoding: spatialChannelColor
            spatialChannelColor: [0, 0, 139]
            spatialSegmentationFilled: true
      image_layer:
        views:
          - spatial
          - layer_controller
        values:
          spatialLayerColormap: viridis
