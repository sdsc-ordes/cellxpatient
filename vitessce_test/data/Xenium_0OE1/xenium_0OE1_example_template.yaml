description: Visualization of gene expression in spatial transcriptomics
name: Xenium 0OE1 Example - Spatial Data

datasets:
  xenium_0OE1:
    type: spatialdata_zarr
    dataset_path: Xenium_0OE1/0OE1_xenium_example.zarr
    is_preprocessed: true
    preprocessing_data:
      clusters_path: analysis/clustering/gene_expression_graphclust/clusters.csv
      spatial_type: xenium
      umap_path: analysis/umap/gene_expression_2_components/projection.csv
    data:
      obs_embedding_names:
      - UMAP
      obs_embedding_paths:
      - tables/table/obsm/X_umap
      obs_seg_paths:
      - shapes/nucleus_boundaries
      - shapes/cell_boundaries
      obs_set_names:
      - Clusters
      obs_set_paths:
      - tables/table/obs/clusters

views:
  description:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 0
    - 0
    - 2
    - 1
    props:
      description: Example view of spatial data (Xenium 0OE1)
  feature_list:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 0
    - 8
    - 2
    - 3
  heatmap:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 2
    - 6
    - 5
    - 6
    props:
      transpose: true
  layer_controller:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 0
    - 4
    - 2
    - 5
  obs_sets:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 0
    - 6
    - 2
    - 3
  scatterplot:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 7
    - 0
    - 5
    - 6
  spatial:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 2
    - 0
    - 5
    - 6
    props:
      description: Comparison of gene expression between Healthy and SLE scRNA-seq
        data
  status:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 0
    - 1
    - 2
    - 1
  violin:
    datasets:
      xenium_0OE1:
        grid_offset_xy:
        - 0
        - 0
    grid_xywh:
    - 7
    - 6
    - 5
    - 6


coordination:
  global:
    datasets:
    - xenium_0OE1
    per_layer:
      image_layer:
        values:
          spatialLayerColormap: viridis
        views:
        - spatial
        - layer_controller
      segmentation_layer:
        cell_channel:
          inherit: true
          values:
            spatialSegmentationFilled: false
        nucleus_channel:
          values:
            obsColorEncoding: spatialChannelColor
            obsType: nucleus
            spatialChannelColor:
            - 0
            - 0
            - 139
            spatialSegmentationFilled: true
        views:
        - spatial
        - layer_controller
    values:
      featureSelection: null
      featureType: gene
      featureValueColormapRange:
      - 0.0
      - 0.5
      featureValueType: expression
      obsColorEncoding: geneSelection
      obsSetSelection: null
      obsType: cell
    views:
    - obs_sets
    - scatterplot
    - feature_list
    - heatmap
    - violin
