name:
description:

# To add custom config relative to react app
custom:
  app:
    height: 1000

# Add all datasets to be used
datasets:
  <dataset_id>: # to differentiate between datasets
    dataset_path:
    type: anndata_zarr or spatialdata_zarr
    grid_offset_xy: [0, 0]
    data:
      # only need to specify if different from the default
      obs_set_paths: [obs/pred_cell_type_filtered]
      obs_set_names: [Cell Type]

    # Add metadata preparation for sample pair comparison
    sample_comparison:
      sample_id_col: sample
      sample_grouping_cols: [SampleColA, SampleColB] # Sample/Patient level metadata column to show for interactive grouping

views:
  <view_type_1>:
    datasets:
      # The grid can be directly specified per dataset with grid_xywh or with grid_offset_xy
      # at the dataset level (view-level grid_xywh below takes precedence)
      <dataset_id>:
        grid_xywh: [0, 0, 0, 0]
    grid_xywh: [0, 0, 6, 2]
    props:
      <props_name>: <props_value>

coordination:
  # Coordination spaces define shared elements (e.g. coloring) that should be coordinated
  # across multiple datasets and views
  <space_id>:
    datasets:
      - <dataset_id>
    views:
      - <view_type_1>
    values:
      # any coordination types supported by Vitessce per view type
      <coord_type>: <value>

    # Option that concerns only the spatial data and spatial view
    # The spatial view has hierarchical coordination spaces (one per layer: image or segmentation)
    # The segmentation layer is itself also hierarchical
    per_layer:
      image_layer:
        values:
          <coord_type>: <value>
        views:
          - <spatial_view_type>
      segmentation_layer:
        # cell_channel or nucleus_channel
        <channel_type>:
          inherit: true # link to all coordination scopes of parent space
          inherit_values: [<coord_type>] # or only these; takes precedence over inherit
          values: # inherited scopes override same coord types here
            <coord_type>: <value>
        views:
          - <spatial_view_type>
